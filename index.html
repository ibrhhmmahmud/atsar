<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#195d63" />
  <meta name="description" content="Atsar — jejak ibadah, tilawah, dan murojaah yang privat dan editable." />
  <title>Atsar</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand-mini" data-route="home" aria-label="Beranda"><span class="brand-dot"></span><span data-brand>Atsar</span></button>
      <button id="installBtn" class="ghost-btn" hidden>Pasang</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navigasi utama">
      <button class="nav-item active" data-route="home"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button class="nav-item" data-route="ibadah"><span class="nav-icon">✓</span><span>Ibadah</span></button>
      <button class="nav-item" data-route="quran"><span class="nav-icon">▤</span><span>Qur'an</span></button>
      <button class="nav-item" data-route="aktivitas"><span class="nav-icon">◷</span><span>Aktivitas</span></button>
      <button class="nav-item" data-route="profil"><span class="nav-icon">○</span><span>Profil</span></button>
    </nav>
  </div>

  <input id="importFile" type="file" accept="application/json" hidden />
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
